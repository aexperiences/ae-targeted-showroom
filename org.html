<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Org &amp; Event Bus — Targeted Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom, d = S.db();
  var c = S.mount({ active: "org.html", crumb: "Agent Org · Event Bus" });
  var accentVar = { sales:"--c-sales", money:"--c-money", prod:"--c-prod", creative:"--c-creative", research:"--c-research", social:"--c-social", ops:"--c-ops" };

  c.innerHTML =
    '<div class="page-h"><div class="ph-ic">⇋</div><div>' +
      '<h1>The Agent Org</h1>' +
      '<div class="sub">Founder → <b>COO (the interface machine)</b> → Department Head → Administrative Executive → ' +
      '<b>Event Bus</b> → Pacemaker → Triad. Info flows up, tasking flows down. Nothing ships until the Pacemaker clears its bar.</div>' +
    '</div></div>' +

    // ---- IVY: the COO interface, a machine of her own ----
    '<div class="card pad-lg mb" style="margin-bottom:16px;border-color:var(--brand);background:linear-gradient(135deg,rgba(255,106,44,.08),var(--ink-2))">' +
      '<div class="flex between" style="align-items:flex-start">' +
        '<div class="flex" style="gap:13px;align-items:flex-start">' +
          '<div class="tmark" style="width:46px;height:46px;font-size:22px">I</div>' +
          '<div><h3 style="font-size:17px">Ivy — the Interface</h3>' +
          '<div class="muted small">COO machine · the single gate between every department head and Anthony</div></div>' +
        '</div><span class="pill brand">apex · no lateral peer</span>' +
      '</div>' +
      '<p class="small muted mt" style="margin-top:12px;line-height:1.6;max-width:820px">Ivy doesn\'t do the department work. She reads what you ask, routes it to the right department, ' +
      'lets that chain do the job under its own confidence bar, then <b>packages one clean answer back to you</b> — and keeps every department on track with calendars and follow-ups. ' +
      'She\'s a gate and a packager, not another pair of hands. Ask her anything:</p>' +
      '<div class="row mt" style="margin-top:12px">' +
        '<div class="field" style="margin-bottom:0"><input class="input" id="ivyq" placeholder="e.g. Should we discount to win Meridian Wealth? · What ships this week? · Are the numbers safe to book?"></div>' +
        '<div style="flex:0 0 auto"><button class="btn primary" id="ivyask" style="height:100%">Ask Ivy ▾</button></div>' +
      '</div>' +
      '<div id="ivyout" class="mt"></div>' +
    '</div>' +

    // ---- hierarchy rules + SSOT/filing ----
    '<div class="grid g-2 mb" style="margin-bottom:16px">' +
      '<div class="card"><div class="card-head"><h3>Company structure &amp; hierarchy rules</h3></div>' +
        '<ul class="small muted" style="line-height:1.7;margin:0;padding-left:18px">' +
          '<li><b>Vertical, within your own department only:</b> every seat talks up and down its own chain — north and south.</li>' +
          '<li><b>Lateral, same position only:</b> AE↔AE, DH↔DH, Pacemaker↔Pacemaker. Admin Executives coordinate the desk work between departments.</li>' +
          '<li><b>The triad has one voice out:</b> only the Pacemaker speaks for the triad. The two lenses never confer — opposing reads are the point.</li>' +
          '<li><b>The COO is apex:</b> no peer, so no lateral. She funnels to the founder.</li>' +
          '<li><b>Every seat is dual-skilled:</b> deep in its craft <i>and</i> in customer service — reacting when there\'s work, running off a calendar, following up.</li>' +
          '<li><b>Confidence-gated release, at two points:</b> the Pacemaker\'s bar, then the COO\'s. Below the bar → hold and escalate, never guess.</li>' +
        '</ul></div>' +
      '<div class="card"><div class="card-head"><h3>SSOT &amp; the filing system</h3><span class="pill">read before acting</span></div>' +
        '<p class="small muted" style="line-height:1.7">Before a single seat acts, it is <b>called to the Source of Truth</b> and reads it — canon, the fences, and this client\'s brief. ' +
        'If the SSOT can\'t be read, the seat <b>stops and says so</b> rather than guessing.</p>' +
        '<p class="small muted mt" style="line-height:1.7">The <b>Administrative Executive owns the filing.</b> Every other seat hands its work to that seat: it packages it, files it to the cabinet, ' +
        'sets the follow-up on the calendar, and carries it up. Continuity lives in the file and on the bus — never in a seat\'s memory.</p>' +
        '<p class="small mt" style="line-height:1.7;color:var(--muted-2)"><b style="color:var(--text-2)">Engine:</b> in the live hub the seats run on <b>DeepSeek</b> (the apex on a reasoning tier). ' +
        'In this browser showroom there\'s no server or key, so a local stand-in brain demonstrates the exact mechanic — the routing, the bars, the contract are real; the model isn\'t live here. That\'s the honest line.</p></div>' +
    '</div>' +

    '<div class="card pad-lg mb" style="margin-bottom:16px">' +
      '<div class="card-head"><h3>Or route straight to a department</h3>' +
        '<span class="pill">real Output Contract · confidence-gated</span></div>' +
      '<div class="row">' +
        '<div class="field" style="flex:0 0 240px"><label>Department</label><select class="input" id="dept">' +
          S.SEATS.depts.map(function(x){return "<option value='"+x.key+"'>"+x.name+" — bar "+x.gate+"%</option>";}).join("") +
        '</select></div>' +
        '<div class="field"><label>Your question</label><input class="input" id="q" placeholder="e.g. What should we close first?"></div>' +
      '</div>' +
      '<button class="btn primary" id="ask">Send it down the chain ▾</button> ' +
      '<button class="btn ghost" id="clear">Clear the bus</button>' +
    '</div>' +

    '<div class="bus-wrap">' +
      '<div><div class="card-head"><h3>Live event bus</h3><span class="pill" id="busct">'+d.bus.length+' events</span></div>' +
        '<div class="busfeed" id="feed"></div></div>' +
      '<div><div class="card-head"><h3>The seats</h3><span class="pill" id="orgtier"></span></div>' +
        '<div class="seatlist" id="seats"></div></div>' +
    '</div>';

  document.getElementById("orgtier").textContent = S.TIERS[S.tier()].name + " tier";

  // ---- seat roster ----
  function renderSeats() {
    var rows = [];
    rows.push(seatRow(S.SEATS.coo.name, "COO · the interface machine", "var(--brand)", "COO", S.SEATS.coo.line, 0));
    S.SEATS.depts.forEach(function (dp) {
      var col = "var("+accentVar[dp.accent]+")";
      rows.push('<div class="nav-group" style="padding:8px 4px 2px">'+dp.name+' · bar '+dp.gate+'%</div>');
      rows.push(seatRow(dp.dh.name, "Department Head — owns the 'so what'", col, "DH", dp.dh.line, 0));
      rows.push(seatRow(dp.ae.name, "Administrative Executive — files &amp; follows up", col, "AE", dp.ae.line, 1));
      rows.push(seatRow(dp.pace.name, "Pacemaker — the only voice out", col, "PACE", dp.pace.line, 1));
      rows.push(seatRow(dp.lensA.name, "Lens — argues for", col, "LENS", dp.lensA.line, 2));
      rows.push(seatRow(dp.lensB.name, "Lens — pushes back", col, "LENS", dp.lensB.line, 2));
    });
    document.getElementById("seats").innerHTML = rows.join("");
  }
  function seatRow(name, role, color, tier, line, indent) {
    return '<div class="seatrow'+(indent?' tier-indent':'')+'" title="'+String(line).replace(/"/g,"&quot;")+'">' +
      '<span class="sd" style="background:'+color+'"></span>' +
      '<div><div class="sn">'+name+'</div><div class="sr">'+role+'</div></div>' +
      '<span class="stier">'+tier+'</span></div>';
  }

  // ---- bus feed ----
  function renderFeed() {
    var feed = document.getElementById("feed");
    var dd = S.db();
    document.getElementById("busct").textContent = dd.bus.length + " events";
    if (!dd.bus.length) {
      feed.innerHTML = '<div class="msg"><div class="mbody muted">The bus is quiet. Ask Ivy or route a question and watch it flow: SSOT read → packaged → triad deliberates → Pacemaker gates → filed → up to the COO. Every hop is logged here as the audit trail.</div></div>';
      return;
    }
    feed.innerHTML = dd.bus.slice().reverse().map(msgHtml).join("");
  }
  function msgHtml(e) {
    var kindCls = { route:"route", deliberate:"deliberate", conclude:"conclude", reject:"reject" }[e.kind] || "";
    var head = '<div class="mhead"><span class="mono" style="opacity:.6">'+e.topic+'</span>' +
      '<span class="kind '+kindCls+'">'+e.kind+'</span></div>';
    var body = '<div class="mhead"><span class="seatchip"><span class="sd" style="background:var(--brand)"></span>'+e.from+'</span>' +
      '<span class="arrow">→</span><span class="seatchip">'+e.to+'</span>' +
      '<span class="muted small" style="margin-left:auto">'+e.stamp+'</span></div>' +
      '<div class="mbody">'+e.body+'</div>';
    var extra = "";
    if (e.conclusion && e.verdict) {
      var v = e.verdict;
      extra = '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+v.conf+'%"></div></div>' +
        '<div class="cmeta"><span>confidence <b>'+v.conf+'%</b></span><span>bar <b>'+e.gate+'%</b> · '+(e.escalate?"HELD":"RELEASED")+'</span></div></div>' +
        '<div class="reasons">'+ v.reasons.map(function(r){
          return '<div class="reason"><span class="rt '+r.t+'">'+r.t+'</span><span>'+r.s+'</span></div>';
        }).join("") +'</div>';
    }
    return '<div class="msg '+(e.conclusion?"conclusion":"")+'">'+head+body+extra+'</div>';
  }

  // ---- staged reveal so you SEE the chain move ----
  function playEvents(evs, doneMsg, ok) {
    var feed = document.getElementById("feed");
    var dd = S.db();
    var addedIds = evs.map(function(e){return e.id;});
    var base = dd.bus.filter(function(e){ return addedIds.indexOf(e.id) < 0; });
    var i = 0;
    (function step(){
      var shown = base.concat(evs.slice(0, i+1));
      feed.innerHTML = shown.slice().reverse().map(msgHtml).join("");
      document.getElementById("busct").textContent = shown.length + " events";
      i++;
      if (i < evs.length) setTimeout(step, 480);
      else S.toast(doneMsg, ok ? "ok" : "warn");
    })();
  }

  function askDept() {
    var r = S.consult(document.getElementById("dept").value, document.getElementById("q").value);
    if (!r) return;
    playEvents(r.events, r.passed ? (r.dept.pace.name+" cleared the bar — released to Ivy.") : (r.dept.pace.name+" held — escalated to Anthony."), r.passed);
  }

  function askIvy() {
    var q = document.getElementById("ivyq").value;
    var res = S.askIvy(q);
    // Ivy's routing event + the consult events are all freshly on the bus; find them.
    var dd = S.db();
    var evs = dd.bus.slice(-(res.result.events.length + 1)); // the coo.route + the chain
    document.getElementById("ivyout").innerHTML =
      '<div class="card" style="padding:14px;border-color:'+(res.on_track?"var(--c-money)":"var(--warn)")+'">' +
        '<div class="flex between"><span class="pill '+(res.on_track?"ok":"warn")+'">'+
          (res.on_track?"On track — released":"Held off your desk — needs a human")+'</span>' +
          '<span class="mono small muted">routed to '+res.dept.name+'</span></div>' +
        '<p class="mt" style="margin-top:10px;font-size:14px;line-height:1.5">'+res.packaged+'</p></div>';
    playEvents(evs, res.on_track ? ("Ivy packaged it up — "+res.dept.name+" cleared its bar.") : ("Ivy held it — "+res.dept.name+" is under its bar."), res.on_track);
  }

  document.getElementById("ask").addEventListener("click", askDept);
  document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") askDept(); });
  document.getElementById("ivyask").addEventListener("click", askIvy);
  document.getElementById("ivyq").addEventListener("keydown", function(e){ if(e.key==="Enter") askIvy(); });
  document.getElementById("clear").addEventListener("click", function () {
    S.save(function(d){ d.bus = []; }); renderFeed(); S.toast("Bus cleared.","ok");
  });

  renderSeats();
  renderFeed();
})();
</script>
</body>
</html>
