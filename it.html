<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT &middot; System Health — Targeted Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom, d = S.db();
  var c = S.mount({ active: "it.html", crumb: "IT · System Health" });

  var ORDER = ["CLEAR", "WATCH", "INTERVENE"];
  function next(state) { return ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]; }
  function pillCls(state) { return state === "CLEAR" ? "ok" : state === "WATCH" ? "warn" : "bad"; }
  // decorative-only uptime spark — a few random-ish bars for visual life
  function spark(seed, state) {
    var col = state === "CLEAR" ? "var(--ok)" : state === "WATCH" ? "var(--warn)" : "var(--bad)";
    var n = 22, out = "";
    for (var i = 0; i < n; i++) {
      var wob = Math.abs(Math.sin((seed.length + i) * 1.7 + i * 0.6));
      var h = 30 + Math.round(wob * 68);                 // 30–98%
      if (state === "INTERVENE" && i > n - 5) h = 8 + (i % 2) * 6; // recent dip on outage
      out += '<span style="height:' + h + '%;background:' + col + '"></span>';
    }
    return '<div class="spark" style="height:34px;width:150px">' + out + '</div>';
  }

  function render() {
    var dd = S.db();
    var sys = dd.systems || [];
    var clear = sys.filter(function (s){ return s.state === "CLEAR"; }).length;
    var watch = sys.filter(function (s){ return s.state === "WATCH"; }).length;
    var interv = sys.filter(function (s){ return s.state === "INTERVENE"; }).length;

    // overall banner state
    var band, bandCls, bandIc, bandLine;
    if (interv > 0) {
      band = "INTERVENE — needs a human";
      bandCls = "bad"; bandIc = "✕";
      bandLine = interv + " service" + (interv > 1 ? "s" : "") + " down or exposed. A real outage/security event pages a person — the org does not sit on this.";
    } else if (watch > 0) {
      band = "WATCH";
      bandCls = "warn"; bandIc = "◔";
      bandLine = watch + " service" + (watch > 1 ? "s" : "") + " under watch — monitoring, nothing yet needs a human. The system self-heals or escalates on its own.";
    } else {
      band = "ALL CLEAR";
      bandCls = "ok"; bandIc = "♥";
      bandLine = "Every service reachable and healthy. No open incidents. The watch stays warm; only a real outage or security event would page a person.";
    }
    var bandColor = bandCls === "bad" ? "var(--bad)" : bandCls === "warn" ? "var(--warn)" : "var(--ok)";
    var bandGlow  = bandCls === "bad" ? "rgba(248,113,113,.12)" : bandCls === "warn" ? "rgba(251,191,36,.10)" : "rgba(74,222,128,.10)";

    c.innerHTML =
      '<div class="page-h"><div class="ph-ic">♥</div><div>' +
        '<h1>IT · System Health</h1>' +
        '<div class="sub">The health of the whole system on one model — <b>CLEAR / WATCH / INTERVENE</b>. ' +
        'The org watches itself; only a real outage or security event (INTERVENE) pages a human.</div>' +
      '</div></div>' +

      // big overall-status banner
      '<div class="card pad-lg" style="border-color:' + bandColor + ';background:linear-gradient(180deg,' + bandGlow + ',var(--ink-2))">' +
        '<div class="flex" style="gap:16px;align-items:center">' +
          '<div class="ph-ic" style="width:54px;height:54px;font-size:26px;flex:0 0 54px;color:' + bandColor + ';border-color:' + bandColor + ';background:var(--ink-2)">' + bandIc + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="flex between" style="align-items:center">' +
              '<h2 style="font-size:22px;letter-spacing:-.4px;color:' + bandColor + '">' + band + '</h2>' +
              '<span class="pill ' + bandCls + '">' + sys.length + ' monitored</span>' +
            '</div>' +
            '<p class="muted small" style="margin-top:6px;line-height:1.55;max-width:760px">' + bandLine + '</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // stat cards
      '<div class="grid g-4 mt" style="margin-top:16px">' +
        stat("Services monitored", sys.length, "◎", "") +
        stat("CLEAR", clear, "♥", "ok") +
        stat("WATCH", watch, "◔", watch ? "warn" : "") +
        stat("INTERVENE", interv, "✕", interv ? "bad" : "") +
      '</div>' +

      // services board
      '<div class="card pad-lg mt" style="margin-top:16px"><div class="card-head"><h3>Services</h3>' +
        '<span class="pill">click a service to cycle its health</span></div>' +
        '<p class="muted small mb" style="line-height:1.55">Every service reports on the same three-state model. Click one to watch the health model react — ' +
        'CLEAR → WATCH → INTERVENE. Setting a service to <b>INTERVENE</b> stages a page to a human on the Approval Desk (Ghost Mode — nothing actually sends).</p>' +
        '<div id="rows"></div>' +
      '</div>' +

      // consult IT
      '<div class="card pad-lg mt" style="margin-top:16px"><div class="card-head"><h3>Consult IT</h3>' +
        '<a class="btn sm" href="org.html">See it on the bus →</a></div>' +
        '<p class="muted small mb" style="line-height:1.55">Route the health question through the org. IT runs an 80% release bar — ' +
        'Pulse (the Pacemaker) calls system health, and a real INTERVENE escalates to a human.</p>' +
        '<button class="btn primary" id="askIt">What\'s the system health right now?</button>' +
        '<div id="ans" class="mt"></div>' +
      '</div>';

    // service rows
    document.getElementById("rows").innerHTML = sys.map(function (s) {
      return '<div class="svc" data-id="' + s.id + '" ' +
        'style="display:flex;align-items:center;gap:14px;padding:14px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.14s;border-radius:10px">' +
        '<span class="pill ' + pillCls(s.state) + '" style="flex:0 0 auto;min-width:96px;justify-content:center"><span class="dot"></span>' + s.state + '</span>' +
        '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600">' + s.name + '</div>' +
          '<div class="muted small mono" style="margin-top:2px">' + s.metric + '</div></div>' +
        spark(s.id + s.name, s.state) +
        '<span class="muted" style="font-size:16px;flex:0 0 auto;opacity:.5">↻</span>' +
      '</div>';
    }).join("");

    // click-to-cycle
    Array.prototype.forEach.call(document.querySelectorAll(".svc"), function (row) {
      row.addEventListener("mouseenter", function(){ row.style.background = "rgba(255,255,255,.02)"; });
      row.addEventListener("mouseleave", function(){ row.style.background = "transparent"; });
      row.addEventListener("click", function () {
        var id = row.getAttribute("data-id");
        var name = "", newState = "";
        S.save(function (x) {
          (x.systems || []).forEach(function (s) {
            if (s.id === id) { s.state = next(s.state); name = s.name; newState = s.state; }
          });
        });
        if (newState === "INTERVENE") {
          S.stage("general", "INTERVENE — " + name,
            "Service " + name + " flagged INTERVENE.",
            "A real outage/security event pages a human.", "IT");
          S.toast(name + " → INTERVENE. Paged a human on the Approval Desk.", "warn");
        } else {
          S.toast(name + " → " + newState + ".", newState === "CLEAR" ? "ok" : "warn");
        }
        render();
      });
    });

    // consult
    document.getElementById("askIt").addEventListener("click", function () {
      var r = S.consult("it", "What's the system health right now?");
      if (!r) return;
      var v = r.verdict, pass = r.passed;
      document.getElementById("ans").innerHTML =
        '<div class="card" style="padding:15px;border-color:' + (pass ? "var(--brand)" : "var(--warn)") + '">' +
          '<div class="flex between"><span class="pill ' + (pass ? "brand" : "warn") + '">' +
            (pass ? r.dept.pace.name + " released ✓" : r.dept.pace.name + " held — needs a human") + '</span>' +
            '<span class="mono small muted">' + v.conf + '% vs ' + r.dept.gate + '% bar</span></div>' +
          '<p class="mt" style="font-size:14px;line-height:1.5">' + v.stance + '</p>' +
          '<div class="conf"><div class="cbar"><div class="cfill" style="width:' + v.conf + '%"></div></div>' +
            '<div class="cmeta"><span>confidence <b>' + v.conf + '%</b></span><span>release bar <b>' + r.dept.gate + '%</b></span></div></div>' +
          '<div class="reasons">' + v.reasons.map(function (rr) {
            return '<div class="reason"><span class="rt ' + rr.t + '">' + rr.t + '</span><span>' + rr.s + '</span></div>';
          }).join("") + '</div>' +
          '<a class="btn sm mt" href="org.html">See it on the bus →</a>' +
        '</div>';
    });
  }

  function stat(label, val, ic, cls) {
    return '<div class="card stat"><div class="k-ic"' + (cls ? ' style="color:var(--' + cls + ')"' : '') + '>' + ic + '</div>' +
      '<div class="k-label">' + label + '</div>' +
      '<div class="k-val"' + (cls ? ' style="color:var(--' + cls + ')"' : '') + '>' + val + '</div></div>';
  }

  render();
})();
</script>
</body>
</html>
