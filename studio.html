<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Studio — Targeted Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom;
  var c = S.mount({ active: "studio.html", crumb: "Creative Studio" });

  var COLS = ["Draft", "In review", "Approved"];

  c.innerHTML =
    '<div class="page-h"><div class="ph-ic">✦</div><div>' +
      '<h1>Creative Studio</h1>' +
      '<div class="sub">The craft layer the whole shop pulls from. Move work Draft → In review → Approved. ' +
      'Nothing goes to a client without founder sign-off.</div>' +
    '</div><div class="spacer"></div>' +
      '<button class="btn primary" id="newBrief">＋ New brief / asset</button>' +
    '</div>' +

    '<div class="grid g-4" id="stats"></div>' +

    '<div class="card pad-lg mt" style="margin-top:16px">' +
      '<div class="card-head"><h3>The board</h3>' +
        '<span class="muted small" style="margin-left:auto">drag a card between columns — the move persists in this session</span></div>' +
      '<div class="kanban" id="board" style="grid-template-columns:repeat(3,1fr)"></div>' +
    '</div>' +

    '<div class="grid g-2 mt" style="margin-top:16px;grid-template-columns:1.15fr .85fr">' +
      '<div class="card pad-lg">' +
        '<div class="card-head"><h3>Creative brief composer</h3><span class="pill">draft-only</span></div>' +
        '<p class="muted small mb">Assemble a clean brief the triad (Iris argues vision, Cade guards craft) can build against. ' +
        'It stays on this desk until the founder clears it.</p>' +
        '<div class="row">' +
          '<div class="field"><label>Client</label><input class="input" id="bClient" placeholder="e.g. Northline Coffee Co."></div>' +
          '<div class="field"><label>Audience</label><input class="input" id="bAud" placeholder="e.g. Local commuters, 25–44"></div>' +
        '</div>' +
        '<div class="field"><label>Objective — the one job this creative must do</label>' +
          '<input class="input" id="bObj" placeholder="e.g. Fill the reopening week with first-time visits"></div>' +
        '<div class="field"><label>Must-haves — brand rules, claims limits, deadlines</label>' +
          '<textarea class="input" id="bMust" placeholder="e.g. Free-cup hook, forest-green palette, no superlative claims, art due Fri"></textarea></div>' +
        '<button class="btn primary" id="draftBrief">Draft the brief ▾</button>' +
        '<div id="briefOut" class="mt"></div>' +
      '</div>' +

      '<div class="card pad-lg">' +
        '<div class="card-head"><h3>The craft bar</h3><span class="pill brand">Juno · Creative Director</span></div>' +
        '<p class="small muted" style="line-height:1.65">Every mark is tested at <b style="color:var(--text-2)">60px and 120px</b> ' +
        'and in <b style="color:var(--text-2)">grayscale</b> before it leaves this desk. If it does not read small, ' +
        'or falls apart without color, it goes back for another pass — no exceptions. ' +
        'Brand-canon changes never ship on the floor; they route to the founder.</p>' +
        '<div class="mt" style="margin-top:16px">' +
          '<button class="btn wide" id="consult">Consult Creative <span class="mono small muted" style="margin-left:6px">bar 80%</span></button>' +
        '</div>' +
        '<div id="verdict" class="mt"></div>' +
      '</div>' +
    '</div>';

  /* ------------------------------------------------------------ stat cards */
  function renderStats() {
    var d = S.db();
    var total = d.assets.length;
    var inReview = d.assets.filter(function (a){ return a.state === "In review"; }).length;
    var approved = d.assets.filter(function (a){ return a.state === "Approved"; }).length;
    document.getElementById("stats").innerHTML =
      stat("Assets on the board", total, "✦", "", "across every client") +
      stat("In review", inReview, "◐", "", "waiting on the craft bar") +
      stat("Approved", approved, "✓", "up", "cleared to production") +
      '<div class="card stat" style="text-align:left">' +
        '<div class="k-ic" style="float:none;margin-bottom:8px">◫</div>' +
        '<div class="k-label">The craft bar</div>' +
        '<div class="small" style="color:var(--text-2);line-height:1.5;margin-top:6px">' +
          'Every mark tested at <b>60/120px</b> + <b>grayscale</b> before it leaves the desk.</div>' +
      '</div>';
  }
  function stat(label, val, ic, dir, delta) {
    return '<div class="card stat"><div class="k-ic">'+ic+'</div>' +
      '<div class="k-label">'+label+'</div><div class="k-val">'+val+'</div>' +
      '<div class="k-delta '+(dir||"")+'">'+(dir==="up"?"▲ ":"")+delta+'</div></div>';
  }

  /* ------------------------------------------------------------ the board */
  function renderBoard() {
    var d = S.db();
    var board = document.getElementById("board");
    board.innerHTML = COLS.map(function (col) {
      var items = d.assets.filter(function (a){ return a.state === col; });
      return '<div class="kcol" data-col="'+col+'">' +
        '<h4>'+col+'<span class="cnt">'+items.length+'</span></h4>' +
        '<div class="kbody" data-col="'+col+'">' +
          items.map(cardHtml).join("") +
          (items.length ? "" : '<div class="muted small" style="padding:8px 4px;text-align:center;opacity:.6">— empty —</div>') +
        '</div></div>';
    }).join("");
    wireDnd();
  }
  function cardHtml(a) {
    return '<div class="kcard" draggable="true" data-id="'+a.id+'">' +
      '<div class="kt">'+esc(a.kind)+'</div>' +
      '<div class="km"><span>'+esc(a.client)+'</span></div>' +
      '<div class="km" style="margin-top:5px"><span class="muted" style="font-size:10.5px">by '+esc(a.by)+'</span></div>' +
      '</div>';
  }

  var dragId = null;
  function wireDnd() {
    var cards = document.querySelectorAll(".kcard");
    cards.forEach(function (card) {
      card.addEventListener("dragstart", function (e) {
        dragId = card.getAttribute("data-id");
        card.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {}
      });
      card.addEventListener("dragend", function () {
        card.classList.remove("dragging"); dragId = null;
        document.querySelectorAll(".kcol").forEach(function(k){ k.classList.remove("drop-hint"); });
      });
    });
    document.querySelectorAll(".kcol").forEach(function (col) {
      col.addEventListener("dragover", function (e) { e.preventDefault(); try{ e.dataTransfer.dropEffect="move"; }catch(x){} col.classList.add("drop-hint"); });
      col.addEventListener("dragleave", function () { col.classList.remove("drop-hint"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault();
        col.classList.remove("drop-hint");
        var id = dragId || (function(){ try{ return e.dataTransfer.getData("text/plain"); }catch(x){ return null; } })();
        var target = col.getAttribute("data-col");
        if (!id || !target) return;
        var moved = false, label = "";
        S.save(function (d) {
          d.assets.forEach(function (a) {
            if (a.id === id && a.state !== target) { a.state = target; moved = true; label = a.kind; }
          });
        });
        if (moved) {
          renderStats(); renderBoard();
          var kind = target === "Approved" ? "ok" : (target === "In review" ? "warn" : "");
          S.toast('"'+label+'" moved to '+target+'.', kind);
        }
      });
    });
  }

  /* ---------------------------------------------------- new brief / asset */
  var modal = S.el(
    '<div class="modal-back" id="mBack"><div class="modal">' +
      '<span class="mx" id="mClose">×</span>' +
      '<h3>New brief / asset</h3>' +
      '<p class="muted small mb">Add a piece of work to the board. It lands wherever you set it and moves as the craft bar clears.</p>' +
      '<div class="field"><label>Client</label><input class="input" id="nClient" placeholder="e.g. Harborview Fitness"></div>' +
      '<div class="field"><label>Kind of asset</label><input class="input" id="nKind" placeholder="e.g. Landing hero, Brand board, Key art"></div>' +
      '<div class="row">' +
        '<div class="field"><label>Assigned to</label><input class="input" id="nBy" placeholder="e.g. Iris"></div>' +
        '<div class="field"><label>Starting state</label><select class="input" id="nState">' +
          COLS.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<button class="btn primary wide mt" id="nAdd">Add to the board</button>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  function openModal(){ modal.classList.add("open"); document.getElementById("nClient").focus(); }
  function closeModal(){ modal.classList.remove("open"); }
  document.getElementById("newBrief").addEventListener("click", openModal);
  document.getElementById("mClose").addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });
  document.getElementById("nAdd").addEventListener("click", function () {
    var client = document.getElementById("nClient").value.trim() || "Untitled client";
    var kind = document.getElementById("nKind").value.trim() || "Untitled asset";
    var by = document.getElementById("nBy").value.trim() || "Iris";
    var state = document.getElementById("nState").value;
    S.save(function (d) { d.assets.push({ id: "a"+Date.now(), client: client, kind: kind, state: state, by: by }); });
    closeModal();
    renderStats(); renderBoard();
    S.toast('Added "'+kind+'" for '+client+' — '+state+'.', "ok");
  });

  /* --------------------------------------------------- brief composer */
  document.getElementById("draftBrief").addEventListener("click", function () {
    var client = document.getElementById("bClient").value.trim();
    var aud = document.getElementById("bAud").value.trim();
    var obj = document.getElementById("bObj").value.trim();
    var must = document.getElementById("bMust").value.trim();
    if (!client && !obj) { S.toast("Add at least a client and an objective.", "warn"); return; }

    var mustLines = must ? must.split(/\n|,|;/).map(function(x){return x.trim();}).filter(Boolean) : [];
    var out = document.getElementById("briefOut");
    out.innerHTML =
      '<div class="card" style="border-color:var(--brand);background:linear-gradient(180deg,rgba(255,106,44,.06),var(--panel))">' +
        '<div class="flex between mb"><span class="pill brand">Creative brief · draft</span>' +
          '<span class="mono small muted">'+new Date().toLocaleDateString()+'</span></div>' +
        briefRow("Client", client || "—") +
        briefRow("Objective", obj || "—") +
        briefRow("Audience", aud || "—") +
        '<div class="brk" style="align-items:flex-start"><span>Must-haves</span><span class="bv" style="text-align:right;max-width:60%">' +
          (mustLines.length
            ? '<ul style="margin:0;padding-left:16px;text-align:left;font-family:var(--font)">' +
                mustLines.map(function(l){ return '<li style="font-size:12.5px;color:var(--text-2);margin:2px 0">'+esc(l)+'</li>'; }).join("") +
              '</ul>'
            : "—") +
        '</span></div>' +
        '<div class="brk"><span>Craft bar</span><span class="bv small">tested at 60/120px + grayscale before release</span></div>' +
        '<button class="btn primary wide mt" id="sendBrief">Send to client ▸</button>' +
        '<div class="muted small mt" style="text-align:center;margin-top:8px">Routes through Proofing for founder sign-off — nothing leaves the floor here.</div>' +
      '</div>';
    document.getElementById("sendBrief").addEventListener("click", function () {
      S.toast("Routes through Proofing for founder sign-off — Ghost Mode.", "warn");
    });
  });
  function briefRow(k, v) {
    return '<div class="brk"><span>'+k+'</span><span class="bv" style="text-align:right;max-width:65%">'+esc(v)+'</span></div>';
  }

  /* ---------------------------------------------------- consult creative */
  document.getElementById("consult").addEventListener("click", function () {
    var r = S.consult("creative", "What ships and what holds for another pass?");
    if (!r) return;
    var v = r.verdict, pass = r.passed;
    document.getElementById("verdict").innerHTML =
      '<div class="card" style="padding:15px;border-color:'+(pass?"var(--brand)":"var(--warn)")+'">' +
        '<div class="flex between"><span class="pill '+(pass?"brand":"warn")+'">'+
          (pass ? r.dept.pace.name+" released ✓" : r.dept.pace.name+" held — needs a human")+'</span>' +
          '<span class="mono small muted">'+v.conf+'% vs '+r.dept.gate+'% bar</span></div>' +
        '<p class="mt" style="font-size:14px;line-height:1.5">'+esc(v.stance)+'</p>' +
        '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+v.conf+'%"></div></div>' +
          '<div class="cmeta"><span>confidence <b>'+v.conf+'%</b></span><span>release bar <b>'+r.dept.gate+'%</b></span></div></div>' +
        '<div class="reasons">'+ v.reasons.map(function (rr) {
          return '<div class="reason"><span class="rt '+rr.t+'">'+rr.t+'</span><span>'+esc(rr.s)+'</span></div>';
        }).join("") +'</div>' +
        '<a class="btn sm mt" href="org.html">See it on the bus →</a>' +
      '</div>';
  });

  /* ------------------------------------------------------------- helpers */
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  renderStats();
  renderBoard();
})();
</script>
</body>
</html>
