<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Pipeline — Targeted OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom;
  var c = S.mount({ active: "pipeline.html", crumb: "CRM · Pipeline" });

  var STAGES = ["Lead","Discovery","Proposal","Negotiation","Won"];
  var OPEN = ["Lead","Discovery","Proposal","Negotiation"];
  var WEIGHT = { Lead:0.10, Discovery:0.30, Proposal:0.55, Negotiation:0.80, Won:1 };
  var INDUSTRIES = ["Retail / F&B","Real Estate","Healthcare","Fitness","Professional","Finance","Ag / DTC","Other"];

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

  // ---- static page frame (stats + board + consult get filled by render) ----
  c.innerHTML =
    '<div class="page-h"><div class="ph-ic">◆</div><div>' +
      '<h1>Pipeline</h1>' +
      '<div class="sub">Every deal, from first touch to signed. Drag a card between stages to move it — the forecast and the books update as it goes.</div>' +
    '</div><div class="spacer"></div>' +
      '<button class="btn primary" id="addDeal">+ Add deal</button>' +
    '</div>' +

    '<div class="grid g-4" id="stats"></div>' +

    '<div class="card pad-lg" style="margin-top:16px"><div class="card-head">' +
      '<h3>The board</h3><span class="pill">drag to move · nothing leaves this browser</span></div>' +
      '<div class="kanban" id="board"></div>' +
    '</div>' +

    '<div class="card pad-lg" style="margin-top:16px"><div class="card-head">' +
      '<h3>Ask New Business</h3><span class="pill brand">bar 80%</span></div>' +
      '<p class="muted small mb">Route the pipeline through the agent org. Reed packages it, the two lenses argue it, and the Pacemaker (Pitch) either clears it to the COO at ≥80% or holds it for a human.</p>' +
      '<button class="btn primary" id="consult">Consult New Business →</button>' +
      '<div id="verdict" class="mt"></div>' +
    '</div>' +

    '<div class="modal-back" id="modalHost"></div>';

  var board = document.getElementById("board");
  var stats = document.getElementById("stats");
  var modalHost = document.getElementById("modalHost");

  // ------------------------------------------------------------- render
  function render() {
    var d = S.db();

    // stats
    var openVal = d.contacts.filter(function(x){ return OPEN.indexOf(x.stage)>=0; })
                            .reduce(function(s,x){ return s+x.value; }, 0);
    var forecast = d.contacts.reduce(function(s,x){
      return OPEN.indexOf(x.stage)>=0 ? s + x.value*WEIGHT[x.stage] : s; }, 0);
    var wonDeals = d.contacts.filter(function(x){ return x.stage==="Won"; });
    var wonVal = wonDeals.reduce(function(s,x){ return s+x.value; }, 0);

    stats.innerHTML =
      stat("Open pipeline", S.money(openVal), "◆", "", OPEN.reduce(function(n,st){
        return n + d.contacts.filter(function(x){return x.stage===st;}).length; },0) + " deals in play") +
      stat("Weighted forecast", S.money(forecast), "≈", "", "probability-adjusted") +
      stat("Deals won", S.money(wonVal), "✓", "up", wonDeals.length + " signed this quarter") +
      stat("Win rate", winRate(d) + "%", "◎", "", "won vs. all closed");

    // board
    board.innerHTML = STAGES.map(function(st){
      var cards = d.contacts.filter(function(x){ return x.stage===st; });
      var sum = cards.reduce(function(s,x){ return s+x.value; }, 0);
      return '<div class="kcol" data-stage="'+st+'">' +
        '<h4>'+st+'<span class="cnt">'+cards.length+' · '+S.money(sum)+'</span></h4>' +
        cards.map(function(x){
          return '<div class="kcard" draggable="true" data-id="'+x.id+'">' +
            '<div class="kt">'+esc(x.name)+'</div>' +
            '<div class="km"><span>'+esc(x.contact)+'</span>' +
              '<span class="kval">'+S.money(x.value)+'</span></div>' +
            '<div style="margin-top:8px"><span class="pill">'+esc(x.industry)+'</span></div>' +
          '</div>';
        }).join("") +
      '</div>';
    }).join("");

    wireBoard();
  }

  function stat(label, val, ic, dir, delta) {
    return '<div class="card stat"><div class="k-ic">'+ic+'</div>' +
      '<div class="k-label">'+label+'</div><div class="k-val">'+val+'</div>' +
      '<div class="k-delta '+(dir||"")+'">'+(dir==="up"?"▲ ":"")+delta+'</div></div>';
  }
  function winRate(d){
    var won = d.contacts.filter(function(x){return x.stage==="Won";}).length;
    var closed = won; // no explicit "Lost" stage in this showroom
    var total = d.contacts.length;
    return total ? Math.round(won/total*100) : 0;
  }

  // ------------------------------------------------------------- drag + click
  var draggingId = null;
  function wireBoard() {
    // cards: drag + click-to-open
    Array.prototype.forEach.call(board.querySelectorAll(".kcard"), function(card){
      card.addEventListener("dragstart", function(e){
        draggingId = card.getAttribute("data-id");
        card.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", draggingId); e.dataTransfer.effectAllowed = "move"; } catch(err){}
      });
      card.addEventListener("dragend", function(){
        card.classList.remove("dragging"); draggingId = null;
        Array.prototype.forEach.call(board.querySelectorAll(".kcol"), function(k){ k.classList.remove("drop-hint"); });
      });
      card.addEventListener("click", function(){ openDetail(card.getAttribute("data-id")); });
    });
    // columns: dropzones
    Array.prototype.forEach.call(board.querySelectorAll(".kcol"), function(col){
      col.addEventListener("dragover", function(e){ e.preventDefault(); try{ e.dataTransfer.dropEffect="move"; }catch(err){} col.classList.add("drop-hint"); });
      col.addEventListener("dragleave", function(){ col.classList.remove("drop-hint"); });
      col.addEventListener("drop", function(e){
        e.preventDefault(); col.classList.remove("drop-hint");
        var id = draggingId; try { id = e.dataTransfer.getData("text/plain") || draggingId; } catch(err){}
        var stage = col.getAttribute("data-stage");
        moveDeal(id, stage);
      });
    });
  }

  function moveDeal(id, stage) {
    if (!id || !stage) return;
    var moved = null;
    S.save(function(d){
      d.contacts.forEach(function(x){ if (x.id===id && x.stage!==stage){ x.stage = stage; moved = x; } });
    });
    render();
    if (moved) S.toast(moved.name + " → " + stage, stage==="Won" ? "ok" : "");
  }

  // ------------------------------------------------------------- detail modal
  function openDetail(id) {
    var d = S.db();
    var x = d.contacts.filter(function(z){ return z.id===id; })[0];
    if (!x) return;
    modalHost.innerHTML =
      '<div class="modal"><span class="mx" id="mClose">×</span>' +
        '<h3>'+esc(x.name)+'</h3>' +
        '<p class="muted small">'+esc(x.contact)+' · '+esc(x.industry)+'</p>' +
        '<div class="grid g-2 mt" style="gap:12px">' +
          field2("Deal value", S.money(x.value)) +
          field2("Owner", esc(x.owner || "—")) +
        '</div>' +
        '<div class="field mt"><label>Notes</label>' +
          '<div class="card" style="padding:12px;font-size:13px;line-height:1.5;color:var(--text-2)">'+esc(x.note||"—")+'</div></div>' +
        '<div class="field"><label>Move stage</label>' +
          '<select class="input" id="mStage">' + STAGES.map(function(st){
            return '<option value="'+st+'"'+(st===x.stage?" selected":"")+'>'+st+'</option>'; }).join("") +
          '</select></div>' +
        '<div class="flex between mt">' +
          '<button class="btn ghost" id="mCancel">Cancel</button>' +
          '<button class="btn primary" id="mSave">Save</button>' +
        '</div>' +
      '</div>';
    modalHost.classList.add("open");
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mSave").onclick = function(){
      var st = document.getElementById("mStage").value;
      moveDeal(x.id, st);
      closeModal();
    };
  }
  function field2(label, val){
    return '<div><div class="k-label" style="font-size:11px">'+label+'</div>' +
      '<div style="font-size:18px;font-weight:700;margin-top:3px">'+val+'</div></div>';
  }

  // ------------------------------------------------------------- add deal modal
  document.getElementById("addDeal").addEventListener("click", function(){
    modalHost.innerHTML =
      '<div class="modal"><span class="mx" id="aClose">×</span>' +
        '<h3>Add a deal</h3>' +
        '<p class="muted small mb">Drops straight onto the board. Nothing is sent to anyone — this is your private pipeline.</p>' +
        '<div class="field"><label>Company / deal name</label><input class="input" id="aName" placeholder="e.g. Lakeside Bakery — launch package"></div>' +
        '<div class="row">' +
          '<div class="field"><label>Contact person</label><input class="input" id="aContact" placeholder="e.g. Jordan Lee"></div>' +
          '<div class="field"><label>Deal value ($)</label><input class="input mono" id="aValue" type="number" value="8000"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><label>Industry</label><select class="input" id="aIndustry">' +
            INDUSTRIES.map(function(i){ return '<option>'+i+'</option>'; }).join("") + '</select></div>' +
          '<div class="field"><label>Stage</label><select class="input" id="aStage">' +
            STAGES.map(function(st){ return '<option'+(st==="Lead"?" selected":"")+'>'+st+'</option>'; }).join("") + '</select></div>' +
        '</div>' +
        '<div class="flex between mt">' +
          '<button class="btn ghost" id="aCancel">Cancel</button>' +
          '<button class="btn primary" id="aSave">Add to pipeline</button>' +
        '</div>' +
      '</div>';
    modalHost.classList.add("open");
    document.getElementById("aClose").onclick = closeModal;
    document.getElementById("aCancel").onclick = closeModal;
    document.getElementById("aSave").onclick = function(){
      var name = (document.getElementById("aName").value || "").trim() || "Untitled deal";
      var contact = (document.getElementById("aContact").value || "").trim() || "—";
      var value = Math.max(0, Math.round(+document.getElementById("aValue").value || 0));
      var industry = document.getElementById("aIndustry").value;
      var stage = document.getElementById("aStage").value;
      S.save(function(d){
        d.contacts.push({ id:"c"+Date.now(), name:name, contact:contact, stage:stage,
          value:value, industry:industry, owner:"Reed", note:"Added from the pipeline board." });
      });
      closeModal();
      render();
      S.toast(name + " added to " + stage, "ok");
    };
  });

  function closeModal(){ modalHost.classList.remove("open"); modalHost.innerHTML = ""; }
  modalHost.addEventListener("click", function(e){ if (e.target === modalHost) closeModal(); });

  // ------------------------------------------------------------- consult the org
  document.getElementById("consult").addEventListener("click", function(){
    var r = S.consult("sales", "Which deals should we prioritize?");
    if (!r) return;
    var v = r.verdict, pass = r.passed;
    document.getElementById("verdict").innerHTML =
      '<div class="card" style="padding:16px;border-color:'+(pass?"var(--brand)":"var(--warn)")+'">' +
        '<div class="flex between"><span class="pill '+(pass?"brand":"warn")+'">'+
          (pass ? r.dept.pace.name+" released ✓" : r.dept.pace.name+" held — needs a human")+'</span>' +
          '<span class="mono small muted">'+v.conf+'% vs '+r.dept.gate+'% bar</span></div>' +
        '<p class="mt" style="font-size:14px;line-height:1.5">'+esc(v.stance)+'</p>' +
        '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+v.conf+'%"></div></div>' +
          '<div class="cmeta"><span>confidence <b>'+v.conf+'%</b></span><span>release bar <b>'+r.dept.gate+'%</b></span></div></div>' +
        '<div class="reasons">' + v.reasons.map(function(rr){
          return '<div class="reason"><span class="rt '+rr.t+'">'+rr.t+'</span><span>'+esc(rr.s)+'</span></div>';
        }).join("") + '</div>' +
        '<a class="btn sm mt" href="org.html">See it on the bus →</a>' +
      '</div>';
  });

  render();
})();
</script>
</body>
</html>
