<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media — Targeted OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom;
  var c = S.mount({ active: "social.html", crumb: "Social Media" });

  var COLS = ["Draft", "Approved", "Posted"];
  var COLNOTE = {
    "Draft":    "being written · not yet cleared",
    "Approved": "voice cleared · scheduled to go out",
    "Posted":   "went out (showroom-only — never a real account)"
  };

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function trunc(s, n){ s = String(s||""); return s.length > n ? s.slice(0, n-1).trim() + "…" : s; }
  function channelCls(ch){
    return { Instagram:"", Facebook:"brand", Email:"ok", LinkedIn:"warn" }[ch] || "";
  }

  // ---------------------------------------------------------------- shell
  c.innerHTML =
    '<div class="page-h"><div class="ph-ic">❋</div><div>' +
      '<h1>Social Media</h1>' +
      '<div class="sub">Every brand\'s public voice in one content queue. Drag a card to move it down the line — ' +
      'and nothing ever hits a real account. In the live OS, a post staged here waits behind a Fence for founder approval (Ghost Mode).</div>' +
    '</div></div>' +

    '<div class="grid g-4" id="stats"></div>' +

    '<div class="card pad-lg" style="margin-top:16px">' +
      '<div class="card-head"><h3>Content queue</h3>' +
        '<span class="pill" id="qct"></span>' +
        '<span style="flex:1"></span>' +
        '<span class="muted small">Drag cards between columns →</span></div>' +
      '<div class="kanban" id="board" style="grid-template-columns:repeat(3,1fr)"></div>' +
    '</div>' +

    '<div class="grid g-2" style="margin-top:16px;grid-template-columns:1fr 1fr">' +
      '<div class="card pad-lg">' +
        '<div class="card-head"><h3>New post</h3><span class="pill">drafts to the queue</span></div>' +
        '<p class="muted small mb">Compose it here; it lands as a <b>Draft</b> for the triad to clear. Nothing publishes from the showroom.</p>' +
        '<div class="row">' +
          '<div class="field" style="flex:1.2"><label>Brand</label>' +
            '<input class="input" id="f-brand" placeholder="e.g. Northline Coffee"></div>' +
          '<div class="field" style="flex:0 0 190px"><label>Channel</label>' +
            '<select class="input" id="f-channel">' +
              '<option>Instagram</option><option>Facebook</option><option>Email</option><option>LinkedIn</option>' +
            '</select></div>' +
        '</div>' +
        '<div class="field"><label>Copy</label>' +
          '<textarea class="input" id="f-copy" maxlength="600" placeholder="Write the post copy the way the brand would say it…"></textarea>' +
          '<div class="cmeta" style="margin-top:6px"><span class="muted small" id="ccount">0 / 600 characters</span>' +
            '<span class="muted small" id="chint"></span></div></div>' +
        '<div class="field"><label>When</label>' +
          '<input class="input" id="f-when" placeholder="e.g. Fri 9:00a · or leave as —"></div>' +
        '<button class="btn primary wide" id="save">Save to queue</button>' +
      '</div>' +

      '<div class="card pad-lg">' +
        '<div class="card-head"><h3>Ask Social</h3>' +
          '<span class="pill">Tempo · bar 80%</span></div>' +
        '<p class="muted small mb">Route the queue through the Social triad — Reach argues for attention, Keeper guards the client\'s name, ' +
        'and Tempo only releases above the 80% bar. Brand-risk copy holds for a human.</p>' +
        '<button class="btn primary wide" id="consult">Consult Social — what publishes, what holds?</button>' +
        '<div id="verdict" class="mt"></div>' +
      '</div>' +
    '</div>';

  // ---------------------------------------------------------------- stats
  function renderStats() {
    var d = S.db();
    var queued   = d.social.filter(function(x){ return x.state !== "Posted"; }).length;
    var approved = d.social.filter(function(x){ return x.state === "Approved"; }).length;
    var posted   = d.social.filter(function(x){ return x.state === "Posted"; }).length;
    var brands   = {};
    d.social.forEach(function(x){ brands[x.brand] = 1; });
    var brandCt  = Object.keys(brands).length;

    document.getElementById("stats").innerHTML =
      stat("In queue", queued, "❋", "", "drafts + approved, pre-post") +
      stat("Approved & scheduled", approved, "◈", approved?"up":"", approved?"cleared the voice bar":"none cleared yet") +
      stat("Posted", posted, "✓", "", "showroom-only, never live") +
      stat("Brands in rotation", brandCt, "◆", "", "distinct client voices");
  }
  function stat(label, val, ic, dir, delta) {
    return '<div class="card stat"><div class="k-ic">'+ic+'</div>' +
      '<div class="k-label">'+label+'</div><div class="k-val">'+val+'</div>' +
      '<div class="k-delta '+(dir||"")+'">'+(dir==="up"?"▲ ":"")+delta+'</div></div>';
  }

  // ---------------------------------------------------------------- board
  function renderBoard() {
    var d = S.db();
    var board = document.getElementById("board");
    var byCol = {}; COLS.forEach(function(k){ byCol[k] = []; });
    d.social.forEach(function(p){ (byCol[p.state] || (byCol[p.state]=[])).push(p); });

    document.getElementById("qct").textContent =
      d.social.filter(function(x){return x.state!=="Posted";}).length + " in queue · " + d.social.length + " total";

    board.innerHTML = COLS.map(function(col) {
      var cards = byCol[col] || [];
      var inner = cards.length
        ? cards.map(cardHtml).join("")
        : '<div class="muted small" style="padding:14px 6px;text-align:center;opacity:.7">Nothing here — drag a card in.</div>';
      return '<div class="kcol" data-col="'+col+'">' +
        '<h4>'+col+'<span class="cnt">'+cards.length+'</span></h4>' +
        '<div class="colnote muted" style="font-size:10px;padding:0 4px 8px;line-height:1.4">'+COLNOTE[col]+'</div>' +
        inner +
      '</div>';
    }).join("");

    wireDnD();
  }

  function cardHtml(p) {
    return '<div class="kcard" draggable="true" data-id="'+esc(p.id)+'">' +
      '<div class="kt">'+esc(p.brand)+'</div>' +
      '<div class="muted small" style="line-height:1.45;margin-bottom:8px">'+esc(trunc(p.copy, 96))+'</div>' +
      '<div class="km">' +
        '<span class="pill '+channelCls(p.channel)+'">'+esc(p.channel)+'</span>' +
        '<span class="mono" style="font-size:10.5px">'+esc(p.when || "—")+'</span>' +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------- drag + drop
  var dragId = null;
  function wireDnD() {
    var cards = document.querySelectorAll("#board .kcard");
    cards.forEach(function(card) {
      card.addEventListener("dragstart", function(e) {
        dragId = card.getAttribute("data-id");
        card.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(_){}
      });
      card.addEventListener("dragend", function() {
        card.classList.remove("dragging"); dragId = null;
        document.querySelectorAll("#board .kcol").forEach(function(k){ k.classList.remove("drop-hint"); });
      });
    });

    var cols = document.querySelectorAll("#board .kcol");
    cols.forEach(function(col) {
      col.addEventListener("dragover", function(e) { e.preventDefault(); try{e.dataTransfer.dropEffect="move";}catch(_){} col.classList.add("drop-hint"); });
      col.addEventListener("dragleave", function() { col.classList.remove("drop-hint"); });
      col.addEventListener("drop", function(e) {
        e.preventDefault();
        col.classList.remove("drop-hint");
        var id = dragId; try { id = e.dataTransfer.getData("text/plain") || dragId; } catch(_){}
        if (!id) return;
        moveCard(id, col.getAttribute("data-col"));
      });
    });
  }

  function moveCard(id, newState) {
    var d = S.db();
    var card = d.social.filter(function(x){ return x.id === id; })[0];
    if (!card || card.state === newState) return;
    var from = card.state;

    S.save(function(dd) {
      var t = dd.social.filter(function(x){ return x.id === id; })[0];
      if (!t) return;
      t.state = newState;
      if (newState === "Posted") {
        t.when = "Just now";
      } else if (newState === "Approved" && (!t.when || t.when === "—")) {
        t.when = "Scheduled";
      } else if (newState === "Draft") {
        t.when = "—";
      }
    });

    if (newState === "Posted") {
      S.toast("Showroom only — in the live OS this stages for founder approval before it hits a real account (Ghost Mode).", "warn");
    } else {
      S.toast(card.brand + " moved " + from + " → " + newState + ".", "ok");
    }
    renderStats();
    renderBoard();
  }

  // ---------------------------------------------------------------- composer
  var copyEl  = document.getElementById("f-copy");
  var countEl = document.getElementById("ccount");
  var hintEl  = document.getElementById("chint");
  function updateCount() {
    var n = copyEl.value.length;
    countEl.textContent = n + " / 600 characters";
    var hint = "";
    if (n === 0)       hint = "";
    else if (n <= 125) hint = "fits Instagram, ads & previews";
    else if (n <= 280) hint = "fits most feeds";
    else               hint = "long — trims in previews";
    hintEl.textContent = hint;
    hintEl.style.color = n > 500 ? "var(--warn)" : "var(--muted)";
  }
  copyEl.addEventListener("input", updateCount);
  updateCount();

  document.getElementById("save").addEventListener("click", function() {
    var brand   = document.getElementById("f-brand").value.trim();
    var channel = document.getElementById("f-channel").value;
    var copy    = copyEl.value.trim();
    var when    = document.getElementById("f-when").value.trim() || "—";
    if (!brand || !copy) {
      S.toast("Add a brand and some copy before saving to the queue.", "warn");
      return;
    }
    S.save(function(d) {
      d.social.push({ id: "s"+Date.now(), brand: brand, copy: copy, channel: channel, state: "Draft", when: when });
    });
    S.toast('Draft saved for ' + brand + ' — it\'s in the queue for the triad to clear.', "ok");
    document.getElementById("f-brand").value = "";
    copyEl.value = ""; updateCount();
    document.getElementById("f-when").value = "";
    renderStats();
    renderBoard();
  });

  // ---------------------------------------------------------------- consult
  document.getElementById("consult").addEventListener("click", function() {
    var r = S.consult("social", "What publishes and what holds for brand safety?");
    if (!r) return;
    var v = r.verdict, pass = r.passed;
    document.getElementById("verdict").innerHTML =
      '<div class="card" style="padding:15px;border-color:'+(pass?"var(--brand)":"var(--warn)")+'">' +
        '<div class="flex between"><span class="pill '+(pass?"brand":"warn")+'">'+
          (pass ? r.dept.pace.name+" released ✓" : r.dept.pace.name+" held — needs a human")+'</span>' +
          '<span class="mono small muted">'+v.conf+'% vs '+r.dept.gate+'% bar</span></div>' +
        '<p class="mt" style="font-size:14px;line-height:1.5">'+esc(v.stance)+'</p>' +
        '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+v.conf+'%"></div></div>' +
          '<div class="cmeta"><span>confidence <b>'+v.conf+'%</b></span>' +
            '<span>release bar <b>'+r.dept.gate+'%</b></span></div></div>' +
        '<div class="reasons">'+ v.reasons.map(function(rr){
          return '<div class="reason"><span class="rt '+rr.t+'">'+rr.t+'</span><span>'+esc(rr.s)+'</span></div>';
        }).join("") +'</div>' +
        '<a class="btn sm mt" href="org.html">See it flow on the bus →</a>' +
      '</div>';
    S.toast(pass ? (r.dept.pace.name+" cleared the "+r.dept.gate+"% bar.")
                 : (r.dept.pace.name+" held below the bar — escalated to a human."),
            pass ? "ok" : "warn");
  });

  // ---------------------------------------------------------------- go
  renderStats();
  renderBoard();
})();
</script>
</body>
</html>
