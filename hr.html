<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR · People Ops — Targeted Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom;
  var c = S.mount({ active: "hr.html", crumb: "HR · People Ops" });

  var DEPTS = ["Command","New Business","Creative","Market Research","Social Media","Production","Money","Operations"];
  var STATUSES = ["Onboarding","Active","Offboarding"];
  // The onboarding paperwork checklist — one row per member, persisted on member.onboard{}.
  var CHECK = [
    { key: "agreement", label: "Contractor agreement signed" },
    { key: "w9",        label: "Form W-9 on file" },
    { key: "login",     label: "Email + hub login provisioned" },
    { key: "territory", label: "Territory / book assigned" }
  ];

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

  var STATUS_PILL = { Onboarding: "warn", Active: "ok", Offboarding: "bad" };

  // ---- static frame ----
  c.innerHTML =
    '<div class="page-h"><div class="ph-ic">☷</div><div>' +
      '<h1>HR · People Ops</h1>' +
      '<div class="sub">Hires, onboarding, and terminations — the health of the team. ' +
        '<b>AI seats and human seats side by side:</b> the org runs on DeepSeek machines, and the first human seat runs a department. ' +
        'A termination is never auto-run — it stages for a person.</div>' +
    '</div><div class="spacer"></div>' +
      '<button class="btn primary" id="addHire">+ Add hire</button>' +
    '</div>' +

    '<div class="grid g-4" id="stats"></div>' +

    '<div class="grid g-2 mt" style="margin-top:16px;grid-template-columns:1.35fr .85fr">' +
      '<div class="card pad-lg">' +
        '<div class="card-head"><h3>The team roster</h3>' +
          '<span class="pill" id="rosterct"></span></div>' +
        '<p class="muted small mb">Every seat, human and machine, on one board. A termination sets status to Offboarding and stages the final pay + access removal to a human — nothing is deleted here.</p>' +
        '<div style="overflow-x:auto"><table class="tbl" id="roster"></table></div>' +
      '</div>' +

      '<div class="card pad-lg" id="onboardCard">' +
        '<div class="card-head"><h3>Onboarding checklist</h3>' +
          '<span class="pill warn" id="onboardct"></span></div>' +
        '<p class="muted small mb">Check each item as it clears — it persists to the member\'s record. First commission can\'t accrue until the agreement + W-9 are signed.</p>' +
        '<div id="onboardBody"></div>' +
      '</div>' +
    '</div>' +

    '<div class="card pad-lg mt" style="margin-top:16px;border-color:var(--brand)">' +
      '<div class="card-head"><h3>Consult HR · People Ops</h3>' +
        '<span class="pill brand">release bar 80% · a termination routes to a human</span></div>' +
      '<p class="muted small mb">Hollis owns the team; Pam packages the paperwork map; Harmony (the Pacemaker) gates it. Clears the 80% bar and it releases to Ivy (COO); a people decision with real exposure holds for a human.</p>' +
      '<button class="btn primary" id="consult">What paperwork is open and who\'s mid-onboarding? →</button>' +
      '<div id="verdict" class="mt"></div>' +
    '</div>' +

    '<div class="modal-back" id="modalHost"></div>';

  var stats = document.getElementById("stats");
  var roster = document.getElementById("roster");
  var modalHost = document.getElementById("modalHost");

  // ------------------------------------------------------------- render
  function render() {
    var d = S.db();
    var team = d.team || [];
    var humans = team.filter(function(t){ return t.type === "Human"; }).length;
    var ai = team.filter(function(t){ return t.type !== "Human"; }).length;
    var onboarding = team.filter(function(t){ return t.status === "Onboarding"; });

    stats.innerHTML =
      stat("Team seats", team.length, "☷", "", "human + AI, side by side") +
      stat("Human seats", humans, "☺", "up", "people on payroll", "brand") +
      stat("AI seats", ai, "◈", "", "DeepSeek machines") +
      stat("Mid-onboarding", onboarding.length, "◔", "", onboarding.length ? "paperwork open" : "all clear", onboarding.length ? "warn" : "ok");

    // roster table
    document.getElementById("rosterct").textContent = team.length + " seats";
    roster.innerHTML =
      '<thead><tr><th>Name</th><th>Role</th><th>Type</th><th>Dept</th><th>Status</th><th>Paperwork</th><th></th></tr></thead>' +
      '<tbody>' + team.map(rosterRow).join("") + '</tbody>';

    // wire per-row offboard buttons
    Array.prototype.forEach.call(roster.querySelectorAll("[data-offboard]"), function(btn){
      btn.addEventListener("click", function(){ beginOffboarding(btn.getAttribute("data-offboard")); });
    });

    renderOnboard();
  }

  function rosterRow(t){
    var typePill = t.type === "Human"
      ? '<span class="pill brand"><span class="dot"></span>Human</span>'
      : '<span class="pill">' + esc(t.type) + '</span>';
    var stPill = '<span class="pill ' + (STATUS_PILL[t.status] || "") + '"><span class="dot"></span>' + esc(t.status) + '</span>';
    // The human hire on the sales desk gets a highlighted row — first human-run department seat.
    var isFeature = t.type === "Human" && t.status === "Onboarding";
    var rowStyle = isFeature
      ? ' style="background:linear-gradient(90deg,rgba(255,106,44,.12),rgba(255,106,44,.02))"'
      : '';
    var nameCell = '<b>' + esc(t.name) + '</b>' +
      (isFeature ? '<div class="mono" style="font-size:9.5px;letter-spacing:.5px;color:var(--brand-ink);text-transform:uppercase;margin-top:3px">★ First human-run seat</div>'
                 : '');
    var action = t.status === "Active"
      ? '<button class="btn sm ghost" data-offboard="' + t.id + '" title="Stages a termination to the Approval Desk — never auto-run">Begin offboarding</button>'
      : (t.status === "Offboarding"
          ? '<span class="pill bad" style="font-size:9.5px">staged to a human</span>'
          : '<span class="muted small">—</span>');
    return '<tr' + rowStyle + '>' +
      '<td>' + nameCell + '</td>' +
      '<td>' + esc(t.role) + '</td>' +
      '<td>' + typePill + '</td>' +
      '<td><span class="muted small">' + esc(t.dept || "—") + '</span></td>' +
      '<td>' + stPill + '</td>' +
      '<td style="max-width:220px"><span class="small" style="color:var(--text-2)">' + esc(t.paper || "—") + '</span></td>' +
      '<td style="text-align:right">' + action + '</td>' +
    '</tr>';
  }

  function stat(label, val, ic, dir, delta, tone){
    var col = tone === "brand" ? "var(--brand-ink)" : (tone ? "var(--"+tone+")" : "var(--text)");
    return '<div class="card stat"><div class="k-ic" style="color:'+col+'">'+ic+'</div>' +
      '<div class="k-label">'+label+'</div>' +
      '<div class="k-val" style="color:'+col+'">'+val+'</div>' +
      '<div class="k-delta '+(dir||"")+'">'+(dir==="up"?"▲ ":"")+delta+'</div></div>';
  }

  // ------------------------------------------------------------- onboarding checklist
  function renderOnboard() {
    var d = S.db();
    var team = d.team || [];
    var members = team.filter(function(t){ return t.status === "Onboarding"; });
    document.getElementById("onboardct").textContent = members.length
      ? members.length + " onboarding" : "all onboarded";
    var body = document.getElementById("onboardBody");

    if (!members.length) {
      body.innerHTML = '<div class="msg"><div class="mbody muted">No one is mid-onboarding. Everyone on the roster is Active or transitioning out.</div></div>';
      return;
    }

    body.innerHTML = members.map(function(m){
      var map = m.onboard || {};
      var done = CHECK.filter(function(ck){ return map[ck.key]; }).length;
      var pct = Math.round(done / CHECK.length * 100);
      return '<div class="card" style="padding:15px;margin-bottom:12px">' +
        '<div class="flex between" style="align-items:flex-start">' +
          '<div><h3 style="font-size:14px">'+esc(m.name)+'</h3>' +
            '<div class="muted small" style="margin-top:2px">'+esc(m.role)+' · '+esc(m.dept||"—")+'</div></div>' +
          '<span class="pill '+(done===CHECK.length?"ok":"warn")+'">'+done+' / '+CHECK.length+'</span>' +
        '</div>' +
        '<div class="conf" style="margin-top:11px"><div class="cbar"><div class="cfill" style="width:'+pct+'%"></div></div></div>' +
        '<div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">' +
          CHECK.map(function(ck){
            var on = !!map[ck.key];
            return '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--text-2)">' +
              '<input type="checkbox" data-mid="'+m.id+'" data-ck="'+ck.key+'" '+(on?"checked":"")+
                ' style="width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:0 0 auto">' +
              '<span style="'+(on?"color:var(--ok)":"")+'">'+esc(ck.label)+'</span>' +
            '</label>';
          }).join("") +
        '</div>' +
        (done===CHECK.length
          ? '<div class="reason" style="margin-top:13px;padding:10px 12px;border:1px solid rgba(74,222,128,.3);border-radius:9px;background:rgba(74,222,128,.06)">' +
              '<span class="rt data">cleared</span>' +
              '<span>Paperwork complete — Pam can move '+esc(m.name.split(" ")[0])+' to <b>Active</b> and commission can accrue.</span></div>'
          : '') +
      '</div>';
    }).join("");

    // wire checkboxes -> persist to member.onboard{}
    Array.prototype.forEach.call(body.querySelectorAll("input[type=checkbox]"), function(box){
      box.addEventListener("change", function(){
        var mid = box.getAttribute("data-mid");
        var ck = box.getAttribute("data-ck");
        var on = box.checked;
        S.save(function(d){
          (d.team || []).forEach(function(t){
            if (t.id === mid){ t.onboard = t.onboard || {}; t.onboard[ck] = on; }
          });
        });
        var lbl = CHECK.filter(function(x){ return x.key === ck; })[0];
        S.toast((on ? "✓ " : "○ ") + (lbl ? lbl.label : "Item") + (on ? " cleared." : " reopened."), on ? "ok" : "warn");
        renderOnboard();
      });
    });
  }

  // ------------------------------------------------------------- termination gate (Ghost Mode)
  function beginOffboarding(id) {
    var d = S.db();
    var m = (d.team || []).filter(function(t){ return t.id === id; })[0];
    if (!m || m.status !== "Active") return;

    modalHost.innerHTML =
      '<div class="modal"><span class="mx" id="oClose">×</span>' +
        '<h3>Begin offboarding — '+esc(m.name)+'</h3>' +
        '<p class="muted small mb">This does <b>not</b> remove '+esc(m.name.split(" ")[0])+'. It sets status to <b>Offboarding</b> and stages the final pay + access removal to the Approval Desk. A termination always routes to a human — the org never executes it.</p>' +
        '<div class="reason" style="margin-bottom:16px;padding:11px 13px;border:1px solid rgba(248,113,113,.3);border-radius:10px;background:rgba(248,113,113,.06);align-items:flex-start">' +
          '<span class="rt assumption" style="background:rgba(248,113,113,.15);color:var(--bad)">fence</span>' +
          '<span><b>'+esc(m.role)+'</b> · '+esc(m.dept||"—")+'. Final pay, 1099/access closeout, and the goodbye are a person\'s call — staged, not sent.</span></div>' +
        '<div class="flex between mt">' +
          '<button class="btn ghost" id="oCancel">Cancel</button>' +
          '<button class="btn primary" id="oStage">Stage to Approval Desk</button>' +
        '</div>' +
      '</div>';
    modalHost.classList.add("open");
    document.getElementById("oClose").onclick = closeModal;
    document.getElementById("oCancel").onclick = closeModal;
    document.getElementById("oStage").onclick = function(){
      S.save(function(dd){
        (dd.team || []).forEach(function(t){
          if (t.id === m.id){ t.status = "Offboarding"; t.paper = "Final pay + access removal (staged to a human)"; }
        });
      });
      S.stage("general", "Termination — " + m.name,
        "Offboarding " + m.role + "; final pay + access removal.",
        "A termination always routes to a human.", "HR");
      closeModal();
      render();
      S.toast(m.name + " → Offboarding. Termination staged to the Approval Desk — nothing auto-run.", "warn");
    };
  }

  // ------------------------------------------------------------- add hire modal
  document.getElementById("addHire").addEventListener("click", function(){
    modalHost.innerHTML =
      '<div class="modal"><span class="mx" id="aClose">×</span>' +
        '<h3>Add a hire</h3>' +
        '<p class="muted small mb">Drops onto the roster. Nothing is sent to anyone — this is your private people board. Start a human on <b>Onboarding</b> and the checklist appears automatically.</p>' +
        '<div class="field"><label>Name</label><input class="input" id="aName" placeholder="e.g. Alex Rivera"></div>' +
        '<div class="field"><label>Role</label><input class="input" id="aRole" placeholder="e.g. Account Executive"></div>' +
        '<div class="row">' +
          '<div class="field"><label>Type</label><select class="input" id="aType">' +
            '<option value="Human">Human</option>' +
            '<option value="AI · DeepSeek">AI · DeepSeek</option>' +
          '</select></div>' +
          '<div class="field"><label>Department</label><select class="input" id="aDept">' +
            DEPTS.map(function(x){ return '<option'+(x==="New Business"?" selected":"")+'>'+x+'</option>'; }).join("") +
          '</select></div>' +
        '</div>' +
        '<div class="field"><label>Starting status</label><select class="input" id="aStatus">' +
          STATUSES.map(function(s){ return '<option'+(s==="Onboarding"?" selected":"")+'>'+s+'</option>'; }).join("") +
        '</select></div>' +
        '<div class="flex between mt">' +
          '<button class="btn ghost" id="aCancel">Cancel</button>' +
          '<button class="btn primary" id="aSave">Add to roster</button>' +
        '</div>' +
      '</div>';
    modalHost.classList.add("open");
    document.getElementById("aClose").onclick = closeModal;
    document.getElementById("aCancel").onclick = closeModal;
    document.getElementById("aSave").onclick = function(){
      var name = (document.getElementById("aName").value || "").trim() || "New hire";
      var role = (document.getElementById("aRole").value || "").trim() || "Team member";
      var type = document.getElementById("aType").value;
      var dept = document.getElementById("aDept").value;
      var status = document.getElementById("aStatus").value;
      var isHuman = type === "Human";
      var paper = status === "Onboarding"
        ? (isHuman ? "Contractor agreement + W-9 pending" : "—")
        : (status === "Offboarding" ? "Final pay + access removal (staged to a human)" : (isHuman ? "On file" : "—"));
      S.save(function(d){
        (d.team = d.team || []).push({
          id: "t" + Date.now(), name: name, role: role, type: type, status: status,
          dept: dept, paper: paper, note: isHuman ? "Added from People Ops." : "AI seat — runs on the DeepSeek org.",
          onboard: {}
        });
      });
      closeModal();
      render();
      S.toast(name + " added to " + dept + " · " + status, "ok");
    };
  });

  function closeModal(){ modalHost.classList.remove("open"); modalHost.innerHTML = ""; }
  modalHost.addEventListener("click", function(e){ if (e.target === modalHost) closeModal(); });

  // ------------------------------------------------------------- consult HR
  document.getElementById("consult").addEventListener("click", function(){
    var r = S.consult("hr", "What paperwork is open and who's mid-onboarding?");
    if (!r) return;
    var v = r.verdict, pass = r.passed;
    document.getElementById("verdict").innerHTML =
      '<div class="card mt" style="padding:18px;margin-top:16px;border-color:'+(pass?"var(--brand)":"var(--warn)")+'">' +
        '<div class="flex between" style="align-items:flex-start;gap:12px">' +
          '<span class="pill '+(pass?"brand":"warn")+'"><span class="dot"></span>'+
            (pass ? r.dept.pace.name+" RELEASED it ✓" : r.dept.pace.name+" HELD it")+'</span>' +
          '<span class="mono small muted">'+v.conf+'% vs '+r.dept.gate+'% bar</span></div>' +
        '<p class="mt" style="font-size:15px;line-height:1.5;font-weight:600">'+esc(v.stance)+'</p>' +
        '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+v.conf+'%"></div></div>' +
          '<div class="cmeta"><span>confidence <b>'+v.conf+'%</b></span>' +
          '<span>release bar <b>'+r.dept.gate+'%</b> · <b style="color:'+(pass?"var(--ok)":"var(--warn)")+'">'+(pass?"RELEASED":"HELD")+'</b></span></div></div>' +
        '<div class="reasons">'+ v.reasons.map(function(rr){
          return '<div class="reason"><span class="rt '+rr.t+'">'+rr.t+'</span><span>'+esc(rr.s)+'</span></div>';
        }).join("") +'</div>' +
        '<a class="btn sm mt" href="org.html">See it on the bus →</a>' +
      '</div>';
    S.toast(pass ? (r.dept.pace.name + " released to Ivy (COO).")
                 : (r.dept.pace.name + " held — routed to a human."),
            pass ? "ok" : "warn");
  });

  render();
})();
</script>
</body>
</html>
