<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaigns — Targeted OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="showroom.css">
</head>
<body>
<script src="showroom.js"></script>
<script>
(function () {
  var S = Showroom;
  var c = S.mount({ active: "campaigns.html", crumb: "Campaigns" });

  /* ------------------------------------------------------------ helpers */
  function pct(num, den) { return den > 0 ? (num / den * 100) : null; }
  function fmtPct(p) { return p == null ? "—" : p.toFixed(1) + "%"; }
  function channelPill(ch) {
    var accent = ch === "Email" ? "prod" : ch === "Paid Social" ? "social" : "sales";
    return '<span class="pill" style="background:var(--panel-3)"><span class="dot" style="background:var(--c-'+accent+')"></span>'+ch+'</span>';
  }
  function statusPill(st) {
    if (st === "Live") return '<span class="pill ok"><span class="dot"></span>Live</span>';
    if (st === "Scheduled") return '<span class="pill warn"><span class="dot"></span>Scheduled</span>';
    return '<span class="pill">Draft</span>';
  }

  /* ------------------------------------------------------- top-of-page stats */
  function computeStats() {
    var d = S.db();
    var reached = 0, totClicks = 0, totSent = 0, emailOpens = 0, emailSent = 0, conv = 0, spend = 0;
    d.campaigns.forEach(function (m) {
      reached += (m.sent || 0);
      totSent += (m.sent || 0);
      totClicks += (m.clicks || 0);
      conv += (m.conv || 0);
      spend += (m.spend || 0);
      if (m.channel === "Email") { emailOpens += (m.opens || 0); emailSent += (m.sent || 0); }
    });
    return {
      reached: reached,
      openRate: pct(emailOpens, emailSent),
      ctr: pct(totClicks, totSent),
      conv: conv,
      spend: spend
    };
  }

  function stat(label, val, ic, sub) {
    return '<div class="card stat"><div class="k-ic">'+ic+'</div>' +
      '<div class="k-label">'+label+'</div><div class="k-val">'+val+'</div>' +
      '<div class="k-delta">'+(sub||"")+'</div></div>';
  }

  /* ----------------------------------------------------------- audience segments */
  function segments() {
    var d = S.db();
    var seen = [], map = {};
    d.contacts.forEach(function (x) {
      var k = x.industry || "Other";
      if (!map[k]) { map[k] = 0; seen.push(k); }
      map[k]++;
    });
    return { list: seen, counts: map, total: d.contacts.length };
  }
  function segCount(seg) {
    if (seg === "__all") return S.db().contacts.length;
    return S.db().contacts.filter(function (x) { return (x.industry || "Other") === seg; }).length;
  }

  /* ------------------------------------------------------------------ render */
  function render() {
    var st = computeStats();
    var seg = segments();

    c.innerHTML =
      '<div class="page-h"><div class="ph-ic"><img src="icons/campaigns.svg" alt=""></div><div>' +
        '<h1>Campaigns</h1>' +
        '<div class="sub">Every campaign the shop runs, live, with the marks of every department on it. Compose a new one below — but nothing leaves the OS. ' +
        'Every send routes to <b>founder approval first</b> (Ghost Mode). This is a real composer, not a demo form.</div>' +
      '</div></div>' +

      '<div class="grid g-4">' +
        stat("Audience reached", st.reached.toLocaleString(), "◈", "across all sent blasts") +
        stat("Avg open rate", fmtPct(st.openRate), "✉", "email campaigns") +
        stat("Avg CTR", fmtPct(st.ctr), "➤", "clicks ÷ delivered") +
        stat("Conversions", st.conv.toLocaleString(), "✓", "attributed this quarter") +
      '</div>' +

      '<div class="grid" style="grid-template-columns:1fr;margin-top:16px">' +
        stat("Ad spend to date", S.money(st.spend), "◇", "media buys · Stripe not wired in the showroom") +
      '</div>' +

      /* ---- campaign board ---- */
      '<div class="card pad-lg mt cb" style="margin-top:16px"><div class="card-head"><h3>Every campaign</h3>' +
        '<span class="pill">tap a card to open it</span></div>' +
        '<div class="cb-rail" id="cbRail"></div>' +
        '<div class="cb-tools"><div class="cb-chips" id="cbChips"></div>' +
          '<input class="input cb-q" id="cbQ" placeholder="Search campaigns">' +
          '<select class="input cb-sort" id="cbSort"><option value="new">Newest</option><option value="name">Name</option>' +
          '<option value="conv">Conversions</option><option value="spend">Spend</option></select></div>' +
        '<div class="cb-deptkey" id="cbKey"></div>' +
        '<div class="cb-grid" id="crows"></div></div>' +

      /* ---- composer + org ---- */
      '<div class="grid g-2 mt" style="margin-top:16px;grid-template-columns:1.15fr .85fr">' +

        '<div class="card pad-lg"><div class="card-head"><h3>New campaign</h3>' +
          '<span class="pill brand">composer</span></div>' +
          '<div class="field"><label>Campaign name</label>' +
            '<input class="input" id="cName" placeholder="e.g. Sunroot — Spring Share Open"></div>' +
          '<div class="row">' +
            '<div class="field"><label>Channel</label><select class="input" id="cChan">' +
              '<option>Email</option><option>Paid Social</option><option>Search</option></select></div>' +
            '<div class="field"><label>Audience segment</label><select class="input" id="cSeg">' +
              '<option value="__all">Whole list</option>' +
              seg.list.map(function (s) { return "<option value=\""+s+"\">"+s+"</option>"; }).join("") +
            '</select></div>' +
          '</div>' +
          '<div class="field"><label>Departments on it</label><div class="dpick" id="cDepts">' +
            DEPTS.map(function (d) { return '<button type="button" class="dp" data-d="'+d[0]+'"><img src="'+d[2]+'" alt="">'+d[1]+'</button>'; }).join("") +
          '</div></div>' +
          '<div class="est-audience mb" id="estBox">' +
            '<div><div class="ea-lab">Estimated audience</div>' +
            '<div class="ea-note" id="eaNote">Contacts in this segment</div></div>' +
            '<div class="ea-big" id="eaBig">0</div></div>' +
          '<div class="field"><label>Subject line</label>' +
            '<input class="input" id="cSubj" placeholder="The line that earns the open"></div>' +
          '<div class="field"><label>Body</label>' +
            '<textarea class="input" id="cBody" placeholder="Write the message. In the real OS the Production and Social triads review copy before anything releases."></textarea></div>' +
          '<div class="row" style="margin-top:2px">' +
            '<button class="btn wide" id="cDraft">Save as draft</button>' +
            '<button class="btn primary wide" id="cBlast">Send blast</button>' +
          '</div>' +
          '<div id="gateNote" class="hide gate-note mt">' +
            '<span class="pill warn"><span class="dot"></span>Staged — Ghost Mode</span>' +
            '<span class="small muted" style="margin-left:8px">Held for founder approval. Nothing left the OS.</span>' +
          '</div>' +
        '</div>' +

        '<div class="card pad-lg"><div class="card-head"><h3>Can we ship the calendar?</h3>' +
          '<a class="btn sm" href="org.html">Open the bus →</a></div>' +
          '<p class="muted small mb">Route the campaign calendar past the <b>Production</b> department. The triad argues it, ' +
          'the Pacemaker gates it on an 80% confidence bar, and it either clears to the COO or escalates to you.</p>' +
          '<button class="btn primary wide" id="consult">Consult Production (bar 80%)</button>' +
          '<div id="verdict" class="mt"></div>' +
        '</div>' +

      '</div>';

    renderRows();
    renderEst();
    wire();
  }

  /* ------------------------------------------------------- departments */
  /* The agency's own departments. Each campaign carries the marks of every
     department working on it, so a card says at a glance who is on the job. */
  var DEPTS = [
    ["newbiz",   "New Business",    "icons/pipeline.svg"],
    ["research", "Market Research", "icons/research.svg"],
    ["creative", "Creative Studio", "icons/studio.svg"],
    ["social",   "Social Media",    "icons/social.svg"],
    ["web",      "Website Builder", "icons/webbuilder.svg"]
  ];
  var SEED_DEPTS = { m1: ["research","creative","social"], m2: ["creative","social"], m3: ["research","web"], m4: ["newbiz","creative"] };
  function dept(k) { return DEPTS.filter(function (d) { return d[0] === k; })[0]; }
  function deptsOf(m) {
    if (Array.isArray(m.depts)) return m.depts.filter(dept);
    if (SEED_DEPTS[m.id]) return SEED_DEPTS[m.id];
    return m.channel === "Email" ? ["creative"] : m.channel === "Search" ? ["web"] : ["social"];
  }
  function marks(list, size) {
    if (!list.length) return '<span class="small muted">No department yet</span>';
    return list.map(function (k) { var d = dept(k);
      return '<img src="'+d[2]+'" alt="'+d[1]+'" title="'+d[1]+'" style="width:'+size+'px;height:'+size+'px">'; }).join("");
  }

  /* --------------------------------------------- board state (this viewer) */
  var F = { st: "all", ch: "all", q: "", sort: "new" };
  try { var saved = JSON.parse(localStorage.getItem("tos-cb-filter")); if (saved) F = Object.assign(F, saved, { q: "" }); } catch (e) {}
  function keepF() { try { localStorage.setItem("tos-cb-filter", JSON.stringify({ st: F.st, ch: F.ch, sort: F.sort })); } catch (e) {} }

  /* ---------------------------------------------------------------- rows */
  function renderRows() {
    var all = S.db().campaigns;
    var STS = [["all","Every"],["Live","Live"],["Scheduled","Scheduled"],["Draft","Draft"]];
    document.getElementById("cbRail").innerHTML = STS.map(function (x) {
      var n = x[0] === "all" ? all.length : all.filter(function (m) { return m.status === x[0]; }).length;
      return '<button class="rs'+(F.st===x[0]?" on":"")+'" data-st="'+x[0]+'"><b>'+n+'</b><span>'+x[1]+'</span></button>';
    }).join("");
    var CHS = ["all","Email","Paid Social","Search"];
    document.getElementById("cbChips").innerHTML = CHS.map(function (c) {
      return '<button class="chip'+(F.ch===c?" on":"")+'" data-ch="'+c+'">'+(c==="all"?"All channels":c)+'</button>';
    }).join("");
    document.getElementById("cbKey").innerHTML = DEPTS.map(function (d) {
      var n = all.filter(function (m) { return deptsOf(m).indexOf(d[0]) > -1; }).length;
      return '<span><img src="'+d[2]+'" alt="">'+d[1]+' <b>'+n+'</b></span>';
    }).join("");
    var q = F.q.toLowerCase();
    var list = all.map(function (m, i) { return { m: m, i: i }; }).filter(function (x) {
      var m = x.m;
      if (F.st !== "all" && m.status !== F.st) return false;
      if (F.ch !== "all" && m.channel !== F.ch) return false;
      if (q) { var t = (m.name+" "+m.channel+" "+deptsOf(m).map(function (k) { return dept(k)[1]; }).join(" ")).toLowerCase(); if (t.indexOf(q) < 0) return false; }
      return true;
    });
    list.sort(function (a, b) {
      if (F.sort === "name") return a.m.name.localeCompare(b.m.name);
      if (F.sort === "conv") return (b.m.conv||0) - (a.m.conv||0);
      if (F.sort === "spend") return (b.m.spend||0) - (a.m.spend||0);
      return b.i - a.i;
    });
    document.getElementById("crows").innerHTML = list.length ? list.map(function (x) {
      var m = x.m;
      var openR = m.channel === "Email" ? fmtPct(pct(m.opens, m.sent)) : "—";
      var staged = m._staged ? ' <span class="pill warn">staged</span>' : "";
      return '<button class="cb-card" data-id="'+m.id+'">' +
        '<div class="cb-marks">'+marks(deptsOf(m), 44)+'</div>' +
        '<div class="cb-name">'+m.name+'</div>' +
        '<div class="cb-pills">'+statusPill(m.status)+channelPill(m.channel)+staged+'</div>' +
        '<div class="cb-nums"><span><b>'+((m.audience||0).toLocaleString())+'</b>audience</span>' +
          '<span><b>'+openR+'</b>open</span><span><b>'+fmtPct(pct(m.clicks, m.sent))+'</b>CTR</span>' +
          '<span><b>'+(m.conv||0)+'</b>conv.</span><span><b>'+(m.spend?S.money(m.spend):"—")+'</b>spend</span></div>' +
      '</button>';
    }).join("") : '<div class="muted small" style="padding:18px 4px">No campaigns match. Clear the filters or start one below.</div>';
  }

  /* --------------------------------------------------------------- sheet */
  function openSheet(id) {
    var m = S.db().campaigns.filter(function (x) { return x.id === id; })[0]; if (!m) return;
    var on = deptsOf(m);
    var back = document.getElementById("cbSheet");
    if (!back) { back = S.el('<div class="modal-back" id="cbSheet"></div>'); document.body.appendChild(back);
      back.addEventListener("click", function (e) { if (e.target === back) back.classList.remove("open"); }); }
    back.innerHTML = '<div class="modal cb-sheet">' +
      '<div class="cb-marks">'+marks(on, 52)+'</div>' +
      '<h3>'+m.name+'</h3>' +
      '<div class="cb-pills">'+statusPill(m.status)+channelPill(m.channel)+'</div>' +
      '<div class="cb-nums mt"><span><b>'+((m.audience||0).toLocaleString())+'</b>audience</span>' +
        '<span><b>'+((m.sent||0).toLocaleString())+'</b>sent</span><span><b>'+(m.clicks||0).toLocaleString()+'</b>clicks</span>' +
        '<span><b>'+(m.conv||0)+'</b>conv.</span></div>' +
      '<div class="field mt"><label>Departments on it</label><div class="dpick" id="sDepts">' +
        DEPTS.map(function (d) { return '<button type="button" class="dp'+(on.indexOf(d[0])>-1?" on":"")+'" data-d="'+d[0]+'"><img src="'+d[2]+'" alt="">'+d[1]+'</button>'; }).join("") +
      '</div></div>' +
      '<div class="field"><label>Where it stands</label><div class="dpick" id="sSteps">' +
        ["Draft","Scheduled","Live"].map(function (t) { return '<button type="button" class="dp'+(m.status===t?" on":"")+'" data-s="'+t+'">'+t+'</button>'; }).join("") +
      '</div><div class="small muted" style="margin-top:6px">Going Live still routes to founder approval first. Nothing leaves the OS.</div></div>' +
      '<button class="btn wide mt" id="sClose">Close</button></div>';
    back.classList.add("open");
    document.getElementById("sClose").onclick = function () { back.classList.remove("open"); };
    document.getElementById("sDepts").onclick = function (e) {
      var b = e.target.closest(".dp"); if (!b) return;
      b.classList.toggle("on");
      var pick = [].slice.call(this.querySelectorAll(".dp.on")).map(function (x) { return x.getAttribute("data-d"); });
      S.save(function (d) { d.campaigns.forEach(function (x) { if (x.id === id) x.depts = pick; }); });
      back.querySelector(".cb-marks").innerHTML = marks(pick, 52);
      renderRows();
    };
    document.getElementById("sSteps").onclick = function (e) {
      var b = e.target.closest(".dp"); if (!b) return;
      var t = b.getAttribute("data-s");
      S.save(function (d) { d.campaigns.forEach(function (x) { if (x.id === id) { x.status = t === "Live" ? "Scheduled" : t; if (t === "Live") x._staged = true; } }); });
      if (t === "Live") S.toast("Staged for founder approval — Ghost Mode. Nothing leaves the OS.", "warn");
      renderRows(); openSheet(id);
    };
  }

  /* -------------------------------------------------------- estimated audience */
  function renderEst() {
    var seg = document.getElementById("cSeg").value;
    var n = segCount(seg);
    document.getElementById("eaBig").textContent = n.toLocaleString();
    document.getElementById("eaNote").textContent = seg === "__all"
      ? "Everyone on the list" : "Contacts in " + seg;
  }

  /* ---------------------------------------------------------------- wiring */
  function wire() {
    document.getElementById("cSeg").addEventListener("change", renderEst);
    document.getElementById("cbRail").onclick = function (e) { var b = e.target.closest(".rs"); if (!b) return; F.st = b.getAttribute("data-st"); keepF(); renderRows(); };
    document.getElementById("cbChips").onclick = function (e) { var b = e.target.closest(".chip"); if (!b) return; F.ch = b.getAttribute("data-ch"); keepF(); renderRows(); };
    document.getElementById("cbQ").oninput = function () { F.q = this.value; renderRows(); };
    var so = document.getElementById("cbSort"); so.value = F.sort; so.onchange = function () { F.sort = this.value; keepF(); renderRows(); };
    document.getElementById("crows").onclick = function (e) { var b = e.target.closest(".cb-card"); if (b) openSheet(b.getAttribute("data-id")); };
    document.getElementById("cDepts").onclick = function (e) { var b = e.target.closest(".dp"); if (b) b.classList.toggle("on"); };

    // Save as draft
    document.getElementById("cDraft").addEventListener("click", function () {
      var name = document.getElementById("cName").value.trim();
      var chan = document.getElementById("cChan").value;
      var seg = document.getElementById("cSeg").value;
      var aud = segCount(seg);
      if (!name) { S.toast("Give the campaign a name first.", "warn"); return; }
      S.save(function (d) {
        d.campaigns.push({
          id: "m" + Date.now(), name: name, channel: chan, status: "Draft",
          audience: aud, sent: 0, opens: 0, clicks: 0, spend: 0, conv: 0,
          depts: [].slice.call(document.querySelectorAll("#cDepts .dp.on")).map(function (x) { return x.getAttribute("data-d"); }),
          subject: document.getElementById("cSubj").value.trim(),
          body: document.getElementById("cBody").value.trim()
        });
      });
      S.toast("Draft saved — " + name + " (" + aud.toLocaleString() + " in audience).", "ok");
      render(); // recompute stats + rows
    });

    // Send blast — Ghost Mode gate, never actually sends
    document.getElementById("cBlast").addEventListener("click", function () {
      var name = document.getElementById("cName").value.trim();
      if (!name) { S.toast("Name the campaign before staging a blast.", "warn"); return; }
      S.save(function (d) {
        var hit = d.campaigns.filter(function (m) { return m.name === name; })[0];
        if (hit) { hit._staged = true; hit.status = "Scheduled"; }
      });
      var box = document.getElementById("gateNote");
      if (box) box.classList.remove("hide");
      S.toast("Staged for founder approval — Ghost Mode. Nothing leaves the OS.", "warn");
      renderRows();
    });

    // Consult Production
    document.getElementById("consult").addEventListener("click", function () {
      var r = S.consult("prod", "Can we deliver the campaign calendar on time?");
      if (!r) return;
      var v = r.verdict, pass = r.passed;
      document.getElementById("verdict").innerHTML =
        '<div class="card" style="padding:15px;border-color:'+(pass?"var(--brand)":"var(--warn)")+'">' +
          '<div class="flex between"><span class="pill '+(pass?"brand":"warn")+'">'+
            (pass ? r.dept.pace.name+" released ✓" : r.dept.pace.name+" held — needs a human")+'</span>' +
            '<span class="mono small muted">'+v.conf+'% vs '+r.dept.gate+'% bar</span></div>' +
          '<p class="mt" style="font-size:14px;line-height:1.5">'+v.stance+'</p>' +
          confBar(v.conf, r.dept.gate) +
          '<div class="reasons">'+ v.reasons.map(function (rr) {
            return '<div class="reason"><span class="rt '+rr.t+'">'+rr.t+'</span><span>'+rr.s+'</span></div>';
          }).join("") +'</div>' +
          '<a class="btn sm mt" href="org.html">See it on the bus →</a>' +
        '</div>';
    });
  }

  function confBar(conf, gate) {
    return '<div class="conf"><div class="cbar"><div class="cfill" style="width:'+conf+'%"></div></div>' +
      '<div class="cmeta"><span>confidence <b>'+conf+'%</b></span><span>release bar <b>'+gate+'%</b></span></div></div>';
  }

  /* scoped styles for this page's two bespoke bits */
  var s = document.createElement("style");
  s.textContent =
    ".est-audience{display:flex;align-items:center;justify-content:space-between;gap:14px;" +
      "background:linear-gradient(135deg,var(--brand-glow),var(--ink-2));border:1px solid var(--line);" +
      "border-radius:12px;padding:14px 16px}" +
    ".est-audience .ea-lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}" +
    ".est-audience .ea-note{font-size:11.5px;color:var(--text-2);margin-top:3px}" +
    ".est-audience .ea-big{font-size:30px;font-weight:800;font-family:var(--mono);color:var(--brand-ink);letter-spacing:-1px}" +
    ".cb-rail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}" +
    ".cb-rail .rs{background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px 8px;color:var(--text-2);cursor:pointer;text-align:center;font:inherit}" +
    ".cb-rail .rs b{display:block;font-size:22px;font-family:var(--mono);color:var(--text)}" +
    ".cb-rail .rs span{font-size:11px;text-transform:uppercase;letter-spacing:.6px}" +
    ".cb-rail .rs.on{border-color:var(--brand);background:var(--brand-glow)}" +
    ".cb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}" +
    ".cb-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}" +
    ".chip{background:var(--panel-3);border:1px solid transparent;color:var(--text-2);border-radius:20px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer}" +
    ".chip.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-glow)}" +
    ".cb-q{flex:1 1 180px;min-width:0}.cb-sort{flex:0 0 140px}" +
    ".cb-deptkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 12px;font-size:11.5px;color:var(--muted)}" +
    ".cb-deptkey span{display:inline-flex;align-items:center;gap:6px}.cb-deptkey img{width:18px;height:18px;border-radius:5px}.cb-deptkey b{color:var(--text-2)}" +
    ".cb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}" +
    ".cb-card{display:block;text-align:left;font:inherit;color:inherit;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px;cursor:pointer;min-width:0}" +
    ".cb-card:hover{border-color:var(--brand)}" +
    ".cb-marks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.cb-marks img{border-radius:11px;display:block}" +
    ".cb-name{font-weight:700;font-size:15px;margin-bottom:8px;overflow-wrap:anywhere}" +
    ".cb-pills{display:flex;flex-wrap:wrap;gap:6px}" +
    ".cb-nums{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--muted)}" +
    ".cb-nums b{display:block;font-family:var(--mono);font-size:13px;color:var(--text)}" +
    ".dpick{display:flex;flex-wrap:wrap;gap:6px}" +
    ".dp{display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);border:1px solid transparent;color:var(--text-2);border-radius:10px;padding:5px 10px 5px 5px;font:600 12px Inter,sans-serif;cursor:pointer}" +
    ".dp img{width:22px;height:22px;border-radius:6px}.dp:not(:has(img)){padding-left:10px}" +
