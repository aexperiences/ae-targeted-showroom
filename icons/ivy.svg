    <line x1="349" y1="239" x2="319" y2="188"/>
    <line x1="245" y1="366" x2="157" y2="315"/>
    <line x1="188" y1="520" x2="129" y2="520"/>
    <line x1="245" y1="674" x2="157" y2="725"/>
    <line x1="349" y1="801" x2="319" y2="852"/>
    <line x1="512" y1="828" x2="512" y2="930"/>
    <line x1="675" y1="801" x2="705" y2="852"/>
    <line x1="779" y1="674" x2="867" y2="725"/>
    <line x1="836" y1="520" x2="895" y2="520"/>
