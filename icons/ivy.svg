    <path d="M-104 -36 C-104 -62 -58 -74 0 -74 C58 -74 104 -62 104 -36 C80 -46 -80 -46 -104 -36 Z" fill="#8b949c"/>
    <path d="M-84 -52 C-60 -64 -28 -68 -6 -68" fill="none" stroke="#dbe1e6" stroke-width="6" stroke-linecap="round" opacity=".45"/>
