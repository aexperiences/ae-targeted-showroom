<stop offset="0%" stop-color="#cfe07a"/><stop offset="55%" stop-color="#78991f"/><stop offset="100%" stop-color="#26340a"/></linearGradient>
<radialGradient id="glfr" cx="32%" cy="6%" r="80%">
